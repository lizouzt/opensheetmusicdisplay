name: Release samples

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Fetch upstream develop
        run: |
          git remote get-url upstream >/dev/null 2>&1 || git remote add upstream https://github.com/opensheetmusicdisplay/opensheetmusicdisplay.git
          git fetch upstream develop

      - name: Install dependencies
        run: npm install

      - name: Check release samples
        run: node tools/check-release-samples.mjs

      - name: Upload fork demo
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: fork-demo/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
